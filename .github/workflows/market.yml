name: 미국 증시 일일 데이터

on:
  schedule:
    - cron: "20 21 * * 1-5"   # 미장 마감 후 (KST 06:20 화~토)
    - cron: "50 22 * * 1-5"   # 첫 실행 실패 대비 재시도 (KST 07:50)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -q requests
      - name: 이전 스냅샷 가져오기 (data 브랜치)
        run: |
          git fetch --depth 1 origin data || true
          mkdir -p out
          if git rev-parse -q --verify FETCH_HEAD >/dev/null; then
            git --work-tree=out checkout FETCH_HEAD -- . || true
            git reset -q
          fi
      - name: 수집
        run: python3 market_data.py out
      - name: data 브랜치에 최신본 올리기
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(jq -r .base_trading_date_et status.json) / 생성 $(jq -r .generated_at_kst status.json) KST"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
