name: Golden Trend 스캔

on:
  schedule:
    # 15분마다 15분봉 추세전환 검사 (항상)
    #   03분 실행 = 본 검사: + KST 09:03·00:03 정기 리포트, + KST 13·17·21·01·05시 4시간봉 검사
    #   18·33·48분 실행 = 15분봉만
    # (공개 저장소라 GitHub Actions 사용 시간 제한 없음)
    - cron: "3 * * * *"
    - cron: "18,33,48 * * * *"
  workflow_dispatch:        # Actions 화면의 'Run workflow' 버튼으로 바로 실행
    inputs:
      mode:
        description: "auto = 시각에 맞게 / scan = 4시간봉 검사 / report = 정기 리포트 / trend = 15분봉 추세전환 / test = 텔레그램 연결 테스트"
        default: "auto"

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: gt-scan
    steps:
      - uses: actions/checkout@v4
      # 러너에 기본 설치된 파이썬을 그대로 씀 (setup-python 생략 → 실행시간 절약)
      - run: python3 -m pip install -q requests
      - name: 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GT_INTERVAL: "4h"
          GT_SELL_ALERTS: ${{ vars.GT_SELL_ALERTS || 'false' }}
          GT_HEARTBEAT: ${{ vars.GT_HEARTBEAT || 'true' }}
          GT_TREND_TOP: ${{ vars.GT_TREND_TOP || '120' }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          GT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${MODE_INPUT:-auto}"
          echo "실행 모드: $MODE"
          python3 scanner.py "$MODE"
      # GitHub은 오래 변화가 없는 저장소의 예약 실행을 멈출 수 있어서, 매일 한 번 다시 켜둠
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ] && [ "${{ github.event.schedule }}" = "3 * * * *" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan.yml/enable" || true
          fi
