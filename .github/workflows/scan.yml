name: Golden Trend 스캔

on:
  schedule:
    # 매시간 3분: 15분봉 추세전환 검사 (항상)
    #   + KST 09:03·00:03 = 정기 리포트
    #   + KST 13·17·21·01·05시 = 4시간봉 검사
    - cron: "3 * * * *"
  workflow_dispatch:        # Actions 화면의 'Run workflow' 버튼으로 바로 실행
    inputs:
      mode:
        description: "auto = 시각에 맞게 / scan = 4시간봉 검사 / report = 정기 리포트 / trend = 15분봉 추세전환 / test = 텔레그램 연결 테스트"
        default: "auto"

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: gt-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 스캔 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GT_INTERVAL: "4h"
          GT_SELL_ALERTS: ${{ vars.GT_SELL_ALERTS || 'false' }}
          GT_HEARTBEAT: ${{ vars.GT_HEARTBEAT || 'true' }}
          GT_TREND_TOP: ${{ vars.GT_TREND_TOP || '120' }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          MODE="${MODE_INPUT:-auto}"
          echo "실행 모드: $MODE"
          python scanner.py "$MODE"
      # GitHub은 오래 변화가 없는 저장소의 예약 실행을 멈출 수 있어서, 매일 한 번 다시 켜둠
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan.yml/enable" || true
          fi
